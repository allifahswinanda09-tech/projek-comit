<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211D35"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7900"/>
      <stop offset="100%" stop-color="#F52235"/>
    </linearGradient>
    <radialGradient id="alarmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F52235" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C101B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="220" fill="url(#alarmGlow)" opacity="0.35"/>

  <!-- Watch Dial Bezel -->
  <circle cx="256" cy="256" r="190" fill="#0d0a1c" stroke="#373155" stroke-width="8"/>
  
  <!-- Outer Progress Ring (Watch accent) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="720 1005" transform="rotate(-90 256 256)"/>

  <!-- Red Emergency Alert Badge / Triangle -->
  <polygon points="256,125 365,315 147,315" fill="#F52235" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Exclamation Mark Inside Triangle -->
  <rect x="248" y="180" width="16" height="65" rx="8" fill="#FFFFFF"/>
  <circle cx="256" cy="280" r="9" fill="#FFFFFF"/>

  <!-- Small Pulse / Sound waves -->
  <path d="M 390 190 Q 420 256 390 322" fill="none" stroke="#00BDEB" stroke-width="10" stroke-linecap="round"/>
  <path d="M 122 190 Q 92 256 122 322" fill="none" stroke="#00BDEB" stroke-width="10" stroke-linecap="round"/>

  <!-- Bottom Brand Text -->
  <text x="256" y="380" font-family="-apple-system, sans-serif" font-weight="800" font-size="28" fill="#F5F5F7" text-anchor="middle" letter-spacing="4">SIAGA</text>
  <circle cx="256" cy="410" r="5" fill="#00BDEB"/>
</svg>

